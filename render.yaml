services:
  - type: web
    name: femcare-backend-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    branch: main
    # PRE-2: /ready checks DB — /health is process-only (no DB query)
    healthCheckPath: /ready
    # PRE-3 / CAUSE-3: Disable autoDeploy. Deploys only via GitHub Actions workflow_dispatch or tag push
    autoDeploy: false
    # PRE-3 / CAUSE-1: Run migrations BEFORE boot, not inside the container CMD
    preDeployCommand: "cd backend && npm run migrate:deploy"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: femcare-prod-db
          property: connectionString
      # Permanent JWT_SECRET set automatically
      - key: JWT_SECRET
        value: "8f4e2b8c9d3f1a6e7b5c4d2a1f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e"
      - key: FRONTEND_URL
        value: https://femcare-frontend-app.onrender.com

  - type: web
    name: femcare-frontend-app
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://femcare-backend-api.onrender.com/api

databases:
  - name: femcare-prod-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 15
