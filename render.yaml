services:
  - type: web
    name: femcare-backend-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: femcare-prod-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: femcare-frontend-app
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    region: frankfurt
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://femcare-backend-api.onrender.com/api

databases:
  - name: femcare-prod-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 15
